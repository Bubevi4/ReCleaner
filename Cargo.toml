[workspace]
resolver = "2"
members = [
    "app",
    "crates/recleaner-core",
    "crates/recleaner-optimizer",
    "crates/recleaner-win",
]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "5"
embed-resource = "3"
globset = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.9"
slint-build = "1.9"
sysinfo = "0.33"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
winreg = "0.52"
windows = "0.58"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
