[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Recleaner desktop application"
default-run = "recleaner"

[[bin]]
name = "recleaner"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
recleaner-core = { path = "../crates/recleaner-core" }
recleaner-optimizer = { path = "../crates/recleaner-optimizer" }
recleaner-win = { path = "../crates/recleaner-win" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
slint.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
embed-resource.workspace = true
slint-build.workspace = true
