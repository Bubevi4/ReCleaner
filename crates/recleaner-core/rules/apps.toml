[[rule]]
id = "app-discord-cache"
category = "apps"
name = { en = "Discord cache", ru = "Кэш Discord" }
paths = ["%APPDATA%\\discord\\Cache", "%APPDATA%\\discord\\Code Cache", "%APPDATA%\\discord\\GPUCache"]
include = ["**/*"]
requires_admin = false
default_enabled = true
risk = "safe"
action = "delete_files"
close_processes = ["Discord"]

