[[rule]]
id = "game-steam-download"
category = "games"
name = { en = "Steam download leftovers", ru = "Остатки загрузок Steam" }
paths = ["%ProgramFiles(x86)%\\Steam\\steamapps\\downloading", "%ProgramFiles%\\Steam\\steamapps\\downloading", "%LOCALAPPDATA%\\Steam\\htmlcache"]
include = ["**/*"]
requires_admin = false
default_enabled = true
risk = "safe"
action = "delete_files"
close_processes = ["steam"]

