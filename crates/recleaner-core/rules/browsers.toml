[[rule]]
id = "browser-chrome-cache"
category = "browsers"
name = { en = "Chrome cache (all profiles)", ru = "Кэш Chrome (все профили)" }
paths = ["%LOCALAPPDATA%\\Google\\Chrome\\User Data"]
include = ["*/Cache/**", "*/Code Cache/**", "*/GPUCache/**", "*/Service Worker/CacheStorage/**", "*/Media Cache/**", "*/ShaderCache/**"]
exclude = ["*/Cookies", "*/Login Data", "*/Bookmarks*", "*/History"]
min_age_hours = 0
requires_admin = false
default_enabled = true
risk = "safe"
action = "delete_files"
close_processes = ["chrome"]

